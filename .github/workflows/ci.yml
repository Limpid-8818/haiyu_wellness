name: Node CI

on:
  push:
  pull_request:

# G32：同一分支/PR 的新提交取消仍在跑的旧 CI，避免双触发全量跑两遍。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 项目源码
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 项目源码/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with an ephemeral database
        env:
          DB_PATH: ${{ runner.temp }}/haiyu-community-test.sqlite
        run: npm test

      - name: Build web application
        run: npm run build
